[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofc-datasets"
version = "0.1.0"
description = "Synthetic multi-fidelity, multi-physics SOFC datasets (HDF5/NPZ)"
authors = [{name = "AutoGen", email = "autogen@example.com"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "h5py>=3.9",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "imageio>=2.34",
  "scikit-image>=0.22",
  "pyyaml>=6.0",
]

[project.scripts]
sofc-gen = "sofc_gen.cli:main"
