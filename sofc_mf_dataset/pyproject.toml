[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofc-mf-dataset"
version = "0.1.0"
description = "Multi-fidelity synthetic dataset generator for SOFC thermo-electro-chemo-mechanical degradation"
authors = [{name = "AutoGen", email = "autogen@example.com"}]
readme = ""
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.1",
  "typer>=0.12",
  "tqdm>=4.66"
]

[project.scripts]
sofc-ds = "sofc_mf_dataset.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sofc_mf_dataset = ["py.typed"]
