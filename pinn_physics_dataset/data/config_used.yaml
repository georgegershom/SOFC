project:
  name: pinn_low_fidelity_physics
  seed: 42
domain:
  Lx: 0.1
  Ly: 0.05
  t_final: 100.0
  include_time: true
  reactive_region:
    x_min: 0.03
    x_max: 0.07
sampling:
  n_interior: 40000
  n_boundary_per_edge: 4000
  n_time_slices: 20
  stratified: true
materials:
  elasticity:
    young_modulus: 1.0e9
    poisson_ratio: 0.3
    thermal_expansion: 1.0e-05
    plane_stress: true
  thermal:
    density: 2500.0
    specific_heat: 800.0
    conductivity: 10.0
    T_ref: 298.15
  electrical:
    sigma_s: 1.0e6
    kappa_e: 1.0
    double_layer_area: 1.0e5
  electrochemistry:
    R: 8.31446261815324
    F: 96485.33212
    alpha_a: 0.5
    alpha_c: 0.5
    j0: 10.0
    U_eq: 3.6
    volumetric: true
    smoothing_length: 0.001
sources:
  joule_heating_scale: 1.0
  reaction_heat_scale: 1.0
boundaries:
  left:
    thermal:
      type: convective
      h: 20.0
      T_inf: 298.15
    mechanical:
      type: fixed
    electrical:
      phi_s:
        type: dirichlet
        value: 4.0
      phi_e:
        type: neumann
        flux: 0.0
  right:
    thermal:
      type: dirichlet
      value: 298.15
    mechanical:
      type: free
    electrical:
      phi_s:
        type: dirichlet
        value: 0.0
      phi_e:
        type: neumann
        flux: 0.0
  top:
    thermal:
      type: insulated
    mechanical:
      type: free
    electrical:
      phi_s:
        type: neumann
        flux: 0.0
      phi_e:
        type: neumann
        flux: 0.0
  bottom:
    thermal:
      type: insulated
    mechanical:
      type: free
    electrical:
      phi_s:
        type: neumann
        flux: 0.0
      phi_e:
        type: neumann
        flux: 0.0
